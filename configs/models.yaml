# Model Registry Manifest for 1D CNN Viral Metagenome Models
# Central declarative configuration for all published model variants.
# No personal or absolute file paths; paths are relative to repository/remote storage root.

models:
  resnet_clean_species:
    architecture: "resnet50_1d"
    rank: "species"
    num_classes: 13683
    checkpoint_rel_path: "cnn_kraken_species/checkpoints/best_resnet_classifier__fast_phase4.pt"
    dropout_rate: 0.5
    selection_criterion: "best_validation_phase4_restart"
    status: "verified"
    verified_hyperparameters:
      optimizer: "AdamW"
      scheduler: "CosineAnnealingLR"
      label_smoothing: 0.1
